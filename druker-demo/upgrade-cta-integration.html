<!-- ══════════════════════════════════════════════════════
     JS — agregar justo antes del cierre </script> del chat
     ══════════════════════════════════════════════════════ -->
<script>
// Muestra el CTA de upgrade cuando el Plan Lite llega al límite
function showUpgradeCTA(container) {
  // No duplicar si ya existe
  if (container.querySelector('.upgrade-cta-bubble')) return;

  const bubble = document.createElement('div');
  bubble.className = 'upgrade-cta-bubble';
  bubble.innerHTML = `
    <div class="upgrade-cta-icon">◎</div>
    <div class="upgrade-cta-body">
      <div class="upgrade-cta-title">Agotaste tus 3 análisis de este mes</div>
      <div class="upgrade-cta-desc">
        Con Plan Full puedes hacer análisis ilimitados. Druker recuerda cada sesión,
        construye tu ICRE y compara decisiones en el tiempo — sin límite mensual.
      </div>
      <a href="/inicio?plan=full&ref=limite_lite" class="upgrade-cta-btn">
        Activar Plan Full →
      </a>
    </div>
  `;
  container.appendChild(bubble);
  bubble.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── INTEGRACIÓN EN EL FETCH DEL CHAT ──────────────────────────
// Busca en el código donde el frontend envía el mensaje a /api/chat.
// Típicamente algo como:
//
//   const res = await fetch('/api/chat', { method: 'POST', body: ... });
//
// Reemplaza (o modifica) ese bloque por el de abajo:

async function enviarMensaje(mensajes, clienteId, perfil, /* ...otros params */ ) {
  const messagesContainer = document.getElementById('messages'); // ajustar al ID real

  const res = await fetch('/api/chat', {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({ messages: mensajes, clienteId, perfil /* , ...otros */ })
  });

  // ── Manejar límite Lite ──────────────────────────────────
  if (res.status === 403) {
    const data = await res.json().catch(() => ({}));
    if (data.upgradeRequired) {
      showUpgradeCTA(messagesContainer);
      return null; // detener el flujo normal
    }
    // Otros 403 (inactivo, trial expirado)
    const msg = data.mensaje || 'Tu acceso está pausado. Escribe a contacto@jvstratica.com';
    agregarMensajeDruker(msg); // función existente que agrega mensajes al chat
    return null;
  }

  if (!res.ok) {
    agregarMensajeDruker('Error de conexión. Intenta de nuevo.');
    return null;
  }

  return res.json();
}
</script>
